name: Build OpenBLOX Wii

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-wii:
    name: Build Wii
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenBLOX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install devkitPro
        uses: devkitPro/gh-actions@v1
        with:
          package: wii-dev

      - name: Install Wii dependencies
        shell: bash
        run: |
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --needed --noconfirm \
            wii-dev \
            wii-sdl

      - name: Check toolchain
        shell: bash
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          powerpc-eabi-gcc --version
          make --version

      - name: Build OpenBLOX Wii
        working-directory: C_Engine
        shell: bash
        run: |
          make wii-clean || true
          make wii

      - name: Find Wii output
        shell: bash
        run: |
          echo "Wii build outputs:"
          find C_Engine -type f \( \
            -name "*.dol" -o \
            -name "*.elf" \
          \) -print

      - name: Package Wii application
        shell: bash
        run: |
          mkdir -p artifact/apps/OpenBLOX

          find C_Engine -type f -name "*.dol" -exec cp {} artifact/apps/OpenBLOX/boot.dol \;

          cat > artifact/apps/OpenBLOX/meta.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <app version="1">
            <name>OpenBLOX</name>
            <coder>Tabletop0263</coder>
            <version>1.0</version>
            <release_date>2026</release_date>
            <short_description>OpenBLOX Wii</short_description>
            <long_description>OpenBLOX Wii build.</long_description>
            <ahb_access/>
            <no_ios_reload/>
          </app>
          EOF

      - name: Upload Wii build
        uses: actions/upload-artifact@v4
        with:
          name: OpenBLOX-Wii
          path: artifact/
          if-no-files-found: error
