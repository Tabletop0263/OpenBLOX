name: Build Wii

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-wii:
    name: Build OpenBLOX Wii
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Wii toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          which powerpc-eabi-gcc
          powerpc-eabi-gcc --version
          which make

      - name: Build OpenBLOX
        working-directory: C_Engine
        run: |
          make wii-clean || true
          make wii

      - name: Locate Wii executable
        run: |
          echo "Searching for DOL files..."
          find . -type f -name "*.dol" -print

      - name: Package Wii Homebrew
        run: |
          mkdir -p OpenBLOX-Wii/apps/OpenBLOX

          DOL=$(find C_Engine -type f -name "*.dol" | head -n 1)

          if [ -z "$DOL" ]; then
            echo "::error::No Wii .dol was produced"
            exit 1
          fi

          echo "Found: $DOL"
          cp "$DOL" OpenBLOX-Wii/apps/OpenBLOX/boot.dol

          cat > OpenBLOX-Wii/apps/OpenBLOX/meta.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <app version="1">
            <name>OpenBLOX</name>
            <coder>Tabletop0263</coder>
            <version>1.0</version>
            <short_description>OpenBLOX Wii</short_description>
            <long_description>OpenBLOX Wii homebrew.</long_description>
          </app>
          EOF

      - name: Upload Wii build
        uses: actions/upload-artifact@v4
        with:
          name: OpenBLOX-Wii
          path: OpenBLOX-Wii/
          if-no-files-found: error
