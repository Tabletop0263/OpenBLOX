name: Build Wii

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-wii:
    name: Build OpenBLOX Wii
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Wii development packages
        run: |
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm wii-dev

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          powerpc-eabi-gcc --version

      - name: Build Wii
        working-directory: C_Engine
        run: |
          make wii-clean || true
          make wii

      - name: Find DOL
        run: |
          find . -type f -name "*.dol" -print

      - name: Prepare Homebrew package
        run: |
          mkdir -p OpenBLOX-Wii/apps/OpenBLOX

          DOL="$(find C_Engine -type f -name '*.dol' | head -n 1)"

          if [ -z "$DOL" ]; then
            echo "ERROR: No .dol file was produced"
            exit 1
          fi

          cp "$DOL" OpenBLOX-Wii/apps/OpenBLOX/boot.dol

          cat > OpenBLOX-Wii/apps/OpenBLOX/meta.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <app version="1">
            <name>OpenBLOX</name>
            <coder>Tabletop0263</coder>
            <version>1.0</version>
            <short_description>OpenBLOX Wii</short_description>
            <long_description>OpenBLOX Wii homebrew.</long_description>
          </app>
          EOF

      - name: Upload Wii build
        uses: actions/upload-artifact@v4
        with:
          name: OpenBLOX-Wii
          path: OpenBLOX-Wii/
