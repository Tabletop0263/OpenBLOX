name: Build Wii

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-wii:
    name: Build OpenBLOX Wii
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure devkitPro
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          export PATH="$DEVKITPPC/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          test -x "$DEVKITPPC/bin/powerpc-eabi-gcc"
          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version

      - name: Build OpenBLOX Wii
        working-directory: C_Engine
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          export PATH="$DEVKITPPC/bin:$DEVKITPRO/tools/bin:$PATH"

          . "$DEVKITPRO/devkitppc.sh"

          make wii-clean || true
          make wii

      - name: Find Wii executable
        run: |
          find C_Engine -type f \
            \( -name "*.dol" -o -name "*.elf" \) \
            -print

      - name: Package
        run: |
          mkdir -p OpenBLOX-Wii/apps/OpenBLOX

          DOL="$(find C_Engine -type f -name '*.dol' | head -n 1)"

          if [ -z "$DOL" ]; then
            echo "::error::No .dol file was produced."
            exit 1
          fi

          cp "$DOL" OpenBLOX-Wii/apps/OpenBLOX/boot.dol

      - name: Upload Wii build
        uses: actions/upload-artifact@v4
        with:
          name: OpenBLOX-Wii
          path: OpenBLOX-Wii/
          if-no-files-found: error
